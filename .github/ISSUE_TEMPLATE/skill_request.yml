name: Skill request
description: Propose a new HLS skill or a major change to an existing one.
labels: ["skill-request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: This repository is public. Do not include PHI, patient-level rows, credentials, or confidential customer details. Link to public sources instead.
  - type: dropdown
    id: request
    attributes:
      label: Request type
      options:
        - New skill
        - Change to an existing skill
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill name
      description: For a change, the existing folder under `skills/`. For a new skill, a proposed `{tool-or-domain}-{purpose}` name (lowercase, hyphens, 64 characters or fewer; see AGENTS.md, Step 2).
      placeholder: "bulk-rnaseq"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: User task
      description: What should an agent be able to do with this skill? Describe it from the user's point of view.
      placeholder: "Run differential expression on bulk RNA-seq counts and explain the top genes."
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tools, data, and methods
      description: Libraries, APIs, Databricks features, and data sources the skill would use. Describe data by schema or public dataset name, not sample rows.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Example sources
      description: Papers, docs, notebooks, repos, or public datasets that show how the task is done today. Public links only.
      placeholder: |
        - https://doi.org/10.1186/s13059-014-0550-8 (DESeq2)
        - https://bioconductor.org/packages/DESeq2
  - type: dropdown
    id: type
    attributes:
      label: Skill type
      description: See AGENTS.md, Step 1.
      options:
        - Pipeline / Toolkit / Database (run this analysis)
        - Guide (decide how to approach this)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark tasks
      description: 3-5 tasks with a checkable answer that would show the skill works (see AGENTS.md, Step 5 and skills/skill-eval).
