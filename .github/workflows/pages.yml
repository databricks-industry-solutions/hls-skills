name: Docs

# Builds the GitHub Pages site on every PR that can change it, and deploys it on
# pushes to dev. The site is docs/index.html (landing page, copied as-is) plus the
# MkDocs guide under /guide/, whose skill pages are generated from skills/*/SKILL.md.
# Deploying requires Settings > Pages > Source: GitHub Actions.
# Build locally: uv run --isolated --with-requirements docs/requirements.txt mkdocs serve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs/**
      - skills/**
      - mkdocs.yml
      - .github/workflows/pages.yml
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; superseded PR builds can be cancelled.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32"

jobs:
  build:
    name: Build docs site
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: mkdocs build --strict
        run: uv run --isolated --with-requirements docs/requirements.txt mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
