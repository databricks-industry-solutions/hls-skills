name: Docs

# Builds the GitHub Pages site with --strict on every PR that can change it and on
# pushes to dev, so broken links or nav fail here. The site is docs/index.html
# (landing page, copied as-is) plus the MkDocs guide under /guide/, whose skill
# pages are generated from skills/*/SKILL.md.
#
# This workflow does not deploy: the organization's IP allow list blocks the Pages
# API from GitHub-hosted runners. A maintainer publishes from an allowed machine
# with `mkdocs gh-deploy` (see DOCS.md); Pages serves the
# gh-pages branch.
# Build locally: uv run --isolated --with-requirements docs/requirements.txt mkdocs serve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs/**
      - skills/**
      - "*.md"
      - mkdocs.yml
      - .github/workflows/pages.yml
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  build:
    name: Build docs site
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: mkdocs build --strict
        run: uv run --isolated --with-requirements docs/requirements.txt mkdocs build --strict
