{#- Material's copyright partial with the Databricks logo in front of it. -#}
<div class="md-copyright vs-copyright">
  <a class="vs-footer-logo" href="https://www.databricks.com/" target="_blank" rel="noopener" title="Databricks">
    <img src="{{ 'guide/assets/databricks-logo.svg' | url }}" alt="Databricks" width="24" height="24">
  </a>
  <div>
    {% if config.copyright %}
      <div class="md-copyright__highlight">
        {{ config.copyright }}
      </div>
    {% endif %}
    {% if not config.extra.generator == false %}
      Made with
      <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
        Material for MkDocs
      </a>
    {% endif %}
  </div>
</div>
